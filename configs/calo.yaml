# CaloChallenge 2022 Dataset 2 (electron showers, 1 GeV - 1 TeV): 45 layers x 16 angular x 9 radial bins.
# As in the paper, SR acts in the transverse plane (angle x radius) and keeps the layers.
# Measured LR = 4 x 3 per layer (HR sum-pooled 4 x 3) + noise + topo-clustering.
# Ladder 4x3 -> 8x9 -> 16x9 (truth-checked) -> 32x18 -> ... -> 2048x1152 (no truth: consistency checks).
dataset: calo
run_name: main
data:
  kind: shower
  source: calo
  zenodo_record: "6366271"
  files: [dataset_2_1.hdf5, dataset_2_2.hdf5]   # 2_1 -> train + val, 2_2 -> test (CaloChallenge convention)
  native_shape: [45, 16, 9]
  planes: 45
  hr_shape: [16, 9]
  circular_u: true               # the angular axis is periodic
  plane_offsets: [-1, 1]         # neighbouring layers
  r_edges: [0.0, 4.65, 9.3, 13.95, 18.6, 27.9, 37.2, 46.5, 55.8, 65.1]
  layer_groups: [[0, 15], [15, 30], [30, 45]]
  hit_threshold: 0.0151          # MeV, CaloChallenge readout threshold
  max_events: null
  test_max: null
  split: [0.9, 0.1, 0.0]         # of dataset_2_1; the test split is dataset_2_2
ladder:
  lr_factor: [4, 3]
  stages: [[2, 3], [2, 1], [2, 2], [2, 2], [2, 2], [2, 2], [2, 2], [2, 2], [2, 2]]
noise:
  rel_sigma: 0.1
sr_train:
  batch_size: 25
refine:
  max_nodes_per_event: 300000
tagger:
  inputs: [hr, lr, lr_up, sr]
  batch_size: 256
