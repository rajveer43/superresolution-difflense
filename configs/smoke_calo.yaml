# Tiny synthetic shower run (CPU): exercises the shower geometry (periodic angle, radial bins, layers).
dataset: smoke_calo
run_name: smoke
device: cpu
num_workers: 0
data:
  kind: shower
  source: synthetic
  planes: 6
  hr_shape: [16, 9]
  circular_u: true
  plane_offsets: [-1, 1]
  r_edges: [0.0, 4.65, 9.3, 13.95, 18.6, 27.9, 37.2, 46.5, 55.8, 65.1]
  layer_groups: [[0, 2], [2, 4], [4, 6]]
  hit_threshold: 0.0151
  max_events: 160
ladder:
  lr_factor: [4, 3]
  stages: [[2, 3], [2, 1], [2, 2], [2, 2]]       # 4x3 -> 8x9 -> 16x9 (truth) -> 32x18 -> 64x36
noise:
  rel_sigma: 0.1
sr_model: {dim: 32, depth: 1, heads: 2, window: 1}
sr_train: {batch_size: 8, epochs: 2, physics_val_every: 1, physics_val_events: 8, max_val: 16}
sampling: {steps: 3, ensemble: 2, batch_size: 16}
refine: {events: 3, ensemble: 2, steps: 2, max_nodes_per_event: 20000, save_events: 1}
tagger: {seeds: [1], epochs: 2, batch_size: 32, n_boot: 10}
eval: {max_events: 50, ensemble_study: [1, 2], ensemble_study_events: 8, n_examples: 1, ecf_top_k: 8, emd_top_k: 16}
