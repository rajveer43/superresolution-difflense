# Held-out-scale check for showers: train only on the noisy 4x3 -> 8x9 transition, score the clean
# 8x9 -> 16x9 stage (never trained on, but with truth) against run "main".
dataset: calo
run_name: extrapolation_check
data:
  kind: shower
  source: calo
  files: [dataset_2_1.hdf5, dataset_2_2.hdf5]
  native_shape: [45, 16, 9]
  planes: 45
  hr_shape: [16, 9]
  circular_u: true
  plane_offsets: [-1, 1]
  r_edges: [0.0, 4.65, 9.3, 13.95, 18.6, 27.9, 37.2, 46.5, 55.8, 65.1]
  layer_groups: [[0, 15], [15, 30], [30, 45]]
  hit_threshold: 0.0151
  split: [0.9, 0.1, 0.0]
ladder:
  lr_factor: [4, 3]
  stages: [[2, 3], [2, 1]]
  train_transitions: [[[4, 3], [8, 9]]]
noise:
  rel_sigma: 0.1
sampling:
  splits: [val, test]
